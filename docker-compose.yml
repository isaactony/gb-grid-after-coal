name: gb-grid

services:
  warehouse:
    image: postgres:16
    container_name: grid-warehouse
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB:-grid}
      POSTGRES_USER: ${WAREHOUSE_USER:-grid_admin}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:?set WAREHOUSE_PASSWORD in .env}
      METABASE_READER_PASSWORD: ${METABASE_READER_PASSWORD:?set METABASE_READER_PASSWORD in .env}
    command: ["postgres", "-c", "work_mem=64MB", "-c", "maintenance_work_mem=512MB", "-c", "shared_buffers=512MB"]
    ports:
      - "${WAREHOUSE_PORT:-5433}:5432"
    volumes:
      - grid-pgdata:/var/lib/postgresql/data
      - ./warehouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  # Optional: a fresh Metabase for anyone reproducing the project (`docker compose --profile metabase up`)
  metabase:
    image: metabase/metabase:v0.63.19.1
    profiles: ["metabase"]
    ports:
      - "3001:3000"
    depends_on:
      warehouse:
        condition: service_healthy

volumes:
  grid-pgdata:
